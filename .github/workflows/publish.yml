name: Publish Package

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: npm-publish
  queue: max
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      id-token: write # Required for OIDC / npm provenance
      contents: write # Required to create and push tags
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      # Node 22 bundles npm 10; the cooldown requires npm >=11.10.
      # Drop this step after Node 22 support ends and all selected Node versions bundle npm >=11.10.
      - name: Use npm with release-age support
        run: npm install -g npm@11.21.1
      - name: Check whether the version is published
        id: version
        run: |
          PACKAGE_NAME=$(jq -r '.name' package.json)
          PACKAGE_VERSION=$(jq -r '.version' package.json)
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --json > "$RUNNER_TEMP/npm-version.json"; then
            echo "Package $PACKAGE_NAME@$PACKAGE_VERSION already exists. Skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif jq -e '.error.code == "E404"' "$RUNNER_TEMP/npm-version.json" > /dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi
      - run: npm ci
        if: steps.version.outputs.publish == 'true'
      - run: npm run build
        if: steps.version.outputs.publish == 'true'
      - run: npm run lint
        if: steps.version.outputs.publish == 'true'
      - run: npm run test
        if: steps.version.outputs.publish == 'true'
      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish --ignore-scripts --provenance

      - name: Create and push tag
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Bump version to')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(jq -r '.version' package.json)
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"
