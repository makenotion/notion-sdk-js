name: Publish Package

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Required for OIDC / npm provenance
      contents: write # Required to create and push tags
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test
      - name: Publish to npm
        run: |
          PACKAGE_NAME=$(jq -r '.name' package.json)
          PACKAGE_VERSION=$(jq -r '.version' package.json)
          if npm view "$PACKAGE_NAME" versions | grep -q "$PACKAGE_VERSION"; then
            echo "Package $PACKAGE_NAME@$PACKAGE_VERSION already exists. Skipping publish."
          else
            echo "Publishing $PACKAGE_NAME@$PACKAGE_VERSION..."
            npm publish --ignore-scripts --provenance
          fi

      - name: Create and push tag
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Bump version to')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(jq -r '.version' package.json)
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"
