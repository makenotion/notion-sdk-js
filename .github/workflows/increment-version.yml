name: Increment Version

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version type to increment"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - premajor

permissions: {}

jobs:
  increment-version:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The contract check needs the last release tag.
          fetch-depth: 0

      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: |
          npm version ${GITHUB_EVENT_INPUTS_VERSION_TYPE} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
        env:
          GITHUB_EVENT_INPUTS_VERSION_TYPE: ${{ github.event.inputs.version_type }}

      - name: Update package-lock.json
        run: npm install

      # Pull requests may merge planned contract changes before a release.
      # This keeps them out of a patch release.
      - name: Check SDK compatibility with the last release
        run: |
          LAST_RELEASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          echo "Comparing with ${LAST_RELEASE}"
          npm run build
          git worktree add --detach "$RUNNER_TEMP/compat-baseline" "$LAST_RELEASE"
          npm run check:compatibility -- "$RUNNER_TEMP/compat-baseline/src/index.ts"

      - name: Create branch and commit changes
        run: |
          BRANCH_NAME="version-bump-v${NEW_VERSION}"
          git checkout -b "$BRANCH_NAME"
          git add package.json package-lock.json
          git commit -m "Bump version to v${NEW_VERSION}"
          git push origin "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_INPUTS_VERSION_TYPE: ${{ github.event.inputs.version_type }}
        run: |
          gh pr create \
            --title "Bump version to v${NEW_VERSION}" \
            --body "This PR bumps the version to v${NEW_VERSION} using npm version ${GITHUB_EVENT_INPUTS_VERSION_TYPE}." \
            --base main \
            --head "${BRANCH_NAME}" \
            --assignee "${GITHUB_ACTOR}"

      - name: Trigger CI on the new branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml -f ref="${BRANCH_NAME}"
